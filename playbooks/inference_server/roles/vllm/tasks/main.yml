---
# Serve one model from an engine image, with Docker owning the container. The box supplies
# the driver, the directories and the key; everything about the engine itself comes from the
# image and the run script rendered below.
- name: Check an engine image was passed
  ansible.builtin.assert:
    that: vllm_image | length > 0
    fail_msg: >-
      vllm_image is empty. This role serves from a container image — set Engine Image on the
      Model Deployment.

- name: Verify an NVIDIA driver is present and working
  ansible.builtin.command: nvidia-smi
  register: vllm_nvidia_smi
  changed_when: false
  failed_when: vllm_nvidia_smi.rc != 0
  # This role deliberately does NOT install/replace the GPU driver. If this fails,
  # install a driver that exposes your GPU (e.g. `ubuntu-drivers install --gpgpu ...`)
  # and reboot, then re-run.

- name: Create vLLM base directory
  ansible.builtin.file:
    path: "{{ vllm_home }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"

- name: Create the per-instance key dir + the container config dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"
  loop:
    - "{{ vllm_home }}/keys"
    - "{{ vllm_container_dir }}"

# A GGUF repo publishes a dozen quantizations of one model, so vLLM takes `repo:QUANT` and
# serves a single file out of it. `hf download` has no such ref — it wants the repo, and left
# alone would pull every quantization. Split the suffix back off and pass it as the file glob.
# Set here rather than beside the download because the space check below needs the repo too.
- name: Split a GGUF quantization off the model ref
  ansible.builtin.set_fact:
    vllm_download_repo: "{{ vllm_model.split(':')[0] }}"
    vllm_download_glob: "{{ '*' + vllm_model.split(':')[1] + '.gguf' if ':' in vllm_model else '' }}"

# ── Room to work ────────────────────────────────────────────────────────────
# The image and the weights land on one disk, and Docker only reports ENOSPC after minutes of
# pulling — from a path inside the image's own filesystem, which names no disk the operator
# recognises. Both downloads are checked here instead, against what the box is still missing:
# an image already pulled or weights already cached cost this deploy nothing, so a redeploy on
# a full-but-working box is never blocked.
- name: Is the engine image already on the box?
  ansible.builtin.command: "docker image inspect {{ vllm_image }}"
  register: vllm_image_present
  changed_when: false
  failed_when: false

- name: Are the weights already in the shared cache?
  ansible.builtin.stat:
    path: "{{ vllm_hf_home }}/hub/models--{{ vllm_download_repo | replace('/', '--') }}"
  register: vllm_weights_cached

- name: Read the free space on the data path
  ansible.builtin.command: "df --output=avail --block-size=1G {{ vllm_home }}"
  register: vllm_df
  changed_when: false

- name: Check the data path can hold what is still to be downloaded
  vars:
    free_gb: "{{ vllm_df.stdout_lines[-1] | trim | regex_replace('G$', '') | int }}"
    image_gb: "{{ 0 if vllm_image_present.rc == 0 else vllm_image_gb }}"
    weights_gb: "{{ 0 if vllm_weights_cached.stat.exists else vllm_weights_gb }}"
    needed_gb: "{{ (image_gb | float + weights_gb | float) | round(1) }}"
  ansible.builtin.assert:
    that: needed_gb | float == 0 or free_gb | int >= needed_gb | float
    fail_msg: >-
      {{ vllm_home }} has {{ free_gb }} GB free, but this deploy still has to download
      {{ needed_gb }} GB there ({{ image_gb }} GB of engine image, {{ weights_gb }} GB of
      weights). Grow this box's root volume — Resize Root Volume on its Machine — and run
      again. Note the image needs more room than it downloads: its layers arrive compressed
      and are unpacked onto the same disk.
    success_msg: >-
      {{ vllm_home }} has {{ free_gb }} GB free for {{ needed_gb }} GB of downloads.

- name: Log in to the image registry
  ansible.builtin.command: "docker login {{ vllm_registry_host }} --username {{ vllm_registry_username }} --password-stdin"
  args:
    stdin: "{{ vllm_registry_token }}"
  no_log: true
  changed_when: false
  when: vllm_registry_token | length > 0

# Deliberately NOT tagged heavy, so Update Engine Config pulls too: a cached image costs one
# digest check, and skipping it would leave `docker run` to pull a fresh tag inline, stretching
# a restart into a multi-GB download the health gate then waits out. The recreate notify is the
# other half — the run script names the image REF, so a moved tag (:latest repushed) renders
# byte-identical and would otherwise keep serving the old image forever. The box, not a stored
# field, owns which image is here.
- name: Pull the engine image (multi-GB on a first pull)
  ansible.builtin.command: "docker pull {{ vllm_image }}"
  register: vllm_pull
  # docker prints "Status: Image is up to date for X" when nothing moved. Matching the
  # negative errs toward a restart, which is what the button already promises anyway.
  changed_when: "'Image is up to date' not in (vllm_pull.stdout | default(''))"
  # Run detached + poll: a multi-GB pull runs for minutes with no channel output, and some
  # hosts (e.g. RunPod's TCP proxy) cap connection duration and drop a long-held SSH session.
  async: 5400
  poll: 15
  notify: recreate vllm container

- name: Create cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"
  loop:
    - "{{ vllm_cache_dir }}/torchinductor"
    - "{{ vllm_cache_dir }}/triton"
    - "{{ vllm_cache_dir }}/torch"
    - "{{ vllm_hf_home }}"

- name: Write Hugging Face token (optional)
  ansible.builtin.copy:
    dest: "{{ vllm_hf_home }}/token"
    content: "{{ vllm_hf_token }}"
    owner: "{{ vllm_user }}"
    mode: "0600"
  when: vllm_hf_token | length > 0

- name: Generate and persist an API key (only when one is not supplied)
  ansible.builtin.shell: >-
    openssl rand -hex 24 > {{ vllm_api_key_file }}
    && chmod 600 {{ vllm_api_key_file }}
  args:
    creates: "{{ vllm_api_key_file }}"
  when: vllm_api_key | length == 0

- name: Read persisted API key
  ansible.builtin.slurp:
    src: "{{ vllm_api_key_file }}"
  register: vllm_api_key_slurp
  when: vllm_api_key | length == 0

# The image's own hf does the download, into the box-shared cache every instance mounts.
# `-e HF_TOKEN` forwards the value from the task environment below rather than spelling it
# out in the argv, which Ansible records verbatim on the Ansible Task doc.
- name: Pre-download model weights into the shared cache
  ansible.builtin.command: >-
    docker run --rm --entrypoint hf
    -e HF_TOKEN
    -v {{ vllm_hf_home }}:/root/.cache/huggingface
    {{ vllm_image }} download {{ vllm_download_repo }}
    {{ '--include ' + vllm_download_glob if vllm_download_glob else '' }}
  environment:
    HF_TOKEN: "{{ vllm_hf_token }}"
  args:
    # Down to the file for a GGUF ref, not just the repo dir: the quantizations share one repo,
    # so a repo-level guard would skip the download after a switch from Q4_K_M to Q8_0 and
    # leave vLLM to fetch it inline, under the health gate.
    creates: >-
      {{ vllm_hf_home }}/hub/models--{{ vllm_download_repo | replace('/', '--') }}{{
      '/snapshots/*/' + vllm_download_glob if vllm_download_glob else '' }}
  when: vllm_predownload_model | bool
  # Weights are many GB → same long-silent-download problem as the pull; run detached + poll
  # so a dropped SSH session can't abort it.
  async: 7200
  poll: 15
  tags: heavy

# Ahead of the container config below, so the route into this instance exists before any replace
# that follows. The engine proxy owns the only public port; vllm_port is reachable from the box
# and nowhere else.
- name: Write the engine proxy location for this instance
  ansible.builtin.template:
    src: engine-location.conf.j2
    dest: "{{ engine_proxy_engines_dir }}/{{ vllm_instance }}.conf"
    mode: "0644"
  notify:
    - check engine proxy config
    - reload engine proxy

# The container's own config, the replace it triggers and the health gate — shared verbatim with
# reconfigure.yml, which runs this file on its own so Update Engine Config never re-does the work
# above.
- name: Write the engine config and bring the container up
  ansible.builtin.import_tasks: config.yml
