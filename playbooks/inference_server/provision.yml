---
# One-time host bootstrap for an Inference Server: NVIDIA driver + data volume (gpu_host
# role), then its metrics exporters and the engine proxy that publishes them -- one Setup click
# leaves the box both serving-ready and scrape-ready. Run by inference_server.setup via
# ansible_runner against a single-host inventory (hosts: all). Separate lifecycle from serve.yml
# -- a box is provisioned once, then serves many models.
#
# The exporters install before engine_proxy because it proxies to them, and grove_https before
# engine_proxy because a `listen 443 ssl` block with no certificate on disk stops nginx starting.
- name: Provision a GPU inference host
  hosts: all
  become: true
  gather_facts: true
  vars:
    monitoring_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  roles:
    - gpu_host
    - node_exporter
    - role: dcgm_exporter
      when: monitoring_has_gpu | bool
    - openresty
    - grove_https
    - engine_proxy
