---
# Deploy & build the Go agent on an ALREADY-provisioned Proxy Server: push
# gateway_service source, build on the proxy, install + restart. Does NOT touch
# OpenResty / Redis / config (use proxy.yml for a full provision).
# extra-vars: agent_source (path to gateway_service source on control plane).
- hosts: all
  become: true
  gather_facts: true

  roles:
    - build_gateway_agent

  tasks:
    - name: install grove-gateway binary
      ansible.builtin.copy:
        src: /tmp/grove-gateway
        dest: /usr/local/bin/grove-gateway
        mode: "0755"
        remote_src: true
      notify: restart grove-gateway

  handlers:
    - name: restart grove-gateway
      ansible.builtin.systemd:
        name: grove-gateway
        state: restarted
        daemon_reload: true
