---
# Update ONLY the OpenResty data-plane config on an already-provisioned Proxy
# Server: push the Lua scripts + nginx.conf, validate, graceful reload. Does NOT
# touch the Go agent, Redis, or packages — use proxy.yml for a full provision,
# deploy_agent.yml for just the binary. Safe on a live gateway: reload (not
# restart) drops no connections, and Redis is left alone so deploy:* routes and
# usage:* counters survive.
- hosts: all
  become: true
  gather_facts: false
  vars:
    grove_dir: "{{ playbook_dir }}"

  tasks:
    - name: grove lua dir
      ansible.builtin.file:
        path: /etc/grove-gateway/lua
        state: directory
        mode: "0755"

    - name: lua files
      ansible.builtin.copy:
        src: "{{ grove_dir }}/lua/"
        dest: /etc/grove-gateway/lua/
        mode: "0644"
      notify: reload openresty

    - name: nginx.conf
      ansible.builtin.copy:
        src: "{{ grove_dir }}/nginx.conf"
        dest: /usr/local/openresty/nginx/conf/nginx.conf
        mode: "0644"
      notify: reload openresty

    # Validates the on-disk config we just pushed. A failure aborts the play
    # BEFORE the reload handler flushes, so a broken config never gets loaded
    # (openresty keeps serving the old one). Note: -t compiles init/config but not
    # *_by_lua_file bodies (lazy per-worker) — a Lua typo still surfaces at request.
    - name: nginx config test
      ansible.builtin.command: /usr/local/openresty/bin/openresty -t
      changed_when: false

  handlers:
    - name: reload openresty
      ansible.builtin.systemd:
        name: openresty
        state: reloaded
