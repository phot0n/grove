---
# What a box needs before it can serve HTTPS with authenticated metrics: a certificate and the
# htpasswd file guarding /metrics/*. Both the inference box's nginx (engine_proxy) and the proxy
# box's OpenResty read these exact paths, which is why they are one role rather than two.
grove_tls_dir: /etc/grove/tls
grove_tls_cert: "{{ grove_tls_dir }}/box.crt"
grove_tls_key: "{{ grove_tls_dir }}/box.key"

# Self-signed, and nothing that connects verifies it: the gateway leaves proxy_ssl_verify at its
# default off and vmagent scrapes with insecure_skip_verify. So the subject names nothing — a SAN
# would imply a check nobody makes, and would have to be reissued every time the box's public IP
# moved. This encrypts the hop; it does not authenticate the box.
grove_tls_subject: /CN=grove-box
# Nothing renews this. The cert is `creates:`-guarded, so it is issued once per box and expires in
# place — harmless only because no consumer checks expiry either, and a box that needs a fresh one
# gets it by deleting the cert and re-running any play that includes this role. Boxes provisioned
# before this was shortened keep whatever life they were issued with.
grove_tls_days: 90

# The hash is computed in the control plane (Grove Settings) and arrives as an extra-var. Running
# htpasswd here instead would put the password in argv — which /proc and the Ansible Task doc both
# record — and would re-salt on every run, rewriting the file for nothing.
grove_metrics_htpasswd: /etc/grove/nginx/metrics.htpasswd
# A constant, not a setting: it has to match monitoring_scrape_username in the vmagent role, and
# nothing is gained by letting an operator set a name that only ever has to agree with itself.
# TestScrapeCredentialsAgree asserts the two stay equal.
scrape_username: grove
# Blank writes a line no password can match, so metrics stay shut rather than opening up.
scrape_password_hash: ""
