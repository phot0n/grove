---
# Install OpenResty at the pinned version. Shared by the Proxy Server's data path and every
# Inference Server's engine proxy, so both run the same build — the config idioms, the defaults
# and the bug surface are then the same wherever someone is debugging.
#
# Deliberately NOT the distro's nginx: that would be whatever each box's release ships (1.18 on
# focal, 1.24+ on noble), which puts different web servers on one request path.

- name: Check whether OpenResty is already installed
  ansible.builtin.command: openresty -v
  register: openresty_probe
  changed_when: false
  failed_when: false

# Probe-then-install, matching the node_exporter/vmagent roles: a re-run over a box that already
# has the pinned build costs one version check and no apt work.
- name: Install OpenResty {{ openresty_version }}
  when: openresty_version not in (openresty_probe.stdout | default('')) + (openresty_probe.stderr | default(''))
  block:
    - name: Install the repo prerequisites
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
          - ca-certificates
          - lsb-release
        state: present
        update_cache: true

    - name: Read the distribution codename
      ansible.builtin.command: lsb_release -sc
      register: openresty_codename
      changed_when: false

    - name: Read the dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: openresty_arch
      changed_when: false

    - name: Fetch the OpenResty signing key
      ansible.builtin.shell: >-
        wget -qO - https://openresty.org/package/pubkey.gpg
        | gpg --dearmor -o {{ openresty_keyring }}
      args:
        creates: "{{ openresty_keyring }}"

    - name: Add the OpenResty repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ openresty_arch.stdout }} signed-by={{ openresty_keyring }}]
          http://openresty.org/package/ubuntu {{ openresty_codename.stdout }} main
        filename: openresty
        state: present
        update_cache: true

    # The package version carries the codename, so the pin stays portable across releases.
    - name: Install the pinned OpenResty package
      ansible.builtin.apt:
        name: "openresty={{ openresty_version }}-1~{{ openresty_codename.stdout }}1"
        state: present

- name: Create the OpenResty log directory
  ansible.builtin.file:
    path: "{{ openresty_log_dir }}"
    state: directory
    mode: "0755"

# Last, deliberately. Distro nginx and OpenResty both want :443, so a box migrating from one to
# the other is without a web server from here until engine_proxy reloads OpenResty onto its
# config — a couple of seconds. Removing it first instead would leave that gap open for the whole
# OpenResty download and install. OpenResty's packaged config listens on :80, so the two coexist
# quite happily until this point.
#
# Removed, not stopped: a merely-stopped nginx takes :443 back on the next boot and OpenResty
# then fails to bind. purge is safe — every Grove config lives under /etc/grove, including the
# per-engine location files, so nothing of ours is in /etc/nginx.
- name: Remove the distribution's nginx if this box ever had one
  ansible.builtin.apt:
    name: nginx
    state: absent
    purge: true
