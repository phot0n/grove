---
# Provision a Grove Ingress Server: local Redis + the pathway binary in ingress mode.
# Deliberately close to gateway.yml — same binary, same certificate — minus every tenant-facing
# piece: no key push, no usage pull, no synthetic-session TTL. What an ingress is GIVEN is what
# keeps it out of the tenant plane, so nothing here hands it tenant configuration.
#
# Redis is rebuildable state here, not durable: the replica table is pushed by the control plane and
# the in-flight counters are re-derived, so this box takes the default persistence rather than the
# gateway's appendfsync always.
#
# extra-vars: admin_token, data_token, agent_version, ingress_id, ingress_hostname, the fleet TLS
# pair, the scrape hash.
- hosts: all
  become: true
  gather_facts: true
  vars:
    grove_dir: "{{ playbook_dir }}"
    # Defaulted here so a play run by hand does not fail on an undefined variable halfway through.
    ingress_hostname: ""
    # No self-signed certificate on a front box — see gateway.yml.
    grove_tls_selfsigned: false

  pre_tasks:
    - name: refuse to provision without an admin token
      ansible.builtin.assert:
        that: admin_token | default('') | trim | length > 0
        fail_msg: >-
          No admin_token was passed — provision from the Ingress Server's Provision button, or
          pass the same extra-vars it does.

    # An ingress given no data token refuses every gateway, which reads as a routing outage rather
    # than the config fault it is. The binary refuses to start on it; caught here instead.
    - name: refuse to provision without a data token
      ansible.builtin.assert:
        that: data_token | default('') | trim | length > 0
        fail_msg: >-
          No data_token was passed — an ingress without one refuses every gateway. Provision from
          the Ingress Server's button, or pass the same extra-vars it does.

  roles:
    - grove_https
    - fleet_tls
    - install_gateway_agent

  tasks:
    - name: stop and disable openresty
      ansible.builtin.systemd:
        name: openresty
        state: stopped
        enabled: false
      failed_when: false

    # The agent used to be named grove-gateway. A box provisioned before the rename still runs
    # the old unit on the ports pathway is about to take, so it is retired the same way
    # openresty is. Logs stay under /var/log/grove-gateway as history; config is re-rendered.
    - name: retire the old grove-gateway unit (agent renamed to pathway)
      ansible.builtin.systemd:
        name: grove-gateway
        state: stopped
        enabled: false
      failed_when: false

    - name: remove the old grove-gateway files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/grove-gateway.service
        - /etc/logrotate.d/grove-gateway
        - /usr/local/bin/grove-gateway
        - /etc/grove-gateway

    - name: forget the removed unit
      ansible.builtin.systemd:
        daemon_reload: true

    # A box provisioned before this carries a self-signed certificate nothing now reads. Removed by
    # file, never by directory: /etc/grove/tls also holds the fleet wildcard this box actually
    # serves, and taking the directory would take that with it.
    - name: remove the self-signed certificate this box no longer serves
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ grove_tls_cert }}"
        - "{{ grove_tls_key }}"

    - name: install redis-server
      ansible.builtin.apt:
        name: redis-server
        state: present
        update_cache: true

    - name: pathway directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/pathway
        - /var/log/pathway

    - name: access log rotation
      ansible.builtin.copy:
        src: "{{ grove_dir }}/logrotate/pathway"
        dest: /etc/logrotate.d/pathway
        mode: "0644"

    - name: gateway binary
      ansible.builtin.copy:
        src: /tmp/pathway
        dest: /usr/local/bin/pathway
        mode: "0755"
        remote_src: true
      notify: restart pathway

    # GROVE_INGRESS_ID is what selects the infra plane, and no tenant variable appears here at all:
    # the binary registers no key-reading handler when it is given this id.
    - name: agent.env
      ansible.builtin.copy:
        dest: /etc/pathway/agent.env
        content: |
          GROVE_ADMIN_TOKEN={{ admin_token }}
          GROVE_INGRESS_ID={{ ingress_id | default('') }}
          GROVE_INGRESS_TOKEN={{ data_token }}
          GROVE_REDIS_ADDR=127.0.0.1:6379
          GROVE_LISTEN_HTTP=:80
          GROVE_LISTEN_HTTPS=:443
          GROVE_SELF_HOST={{ ingress_hostname }}
          GROVE_TLS_CERT={{ fleet_tls_cert_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_TLS_KEY={{ fleet_tls_key_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_HTPASSWD={{ grove_metrics_htpasswd }}
          GROVE_ACCESS_LOG=/var/log/pathway/access.log
          GROVE_ERROR_LOG=/var/log/pathway/error.log
          GROVE_CONFIG=/etc/pathway/config.json
          GROVE_PID_FILE=/run/pathway.pid
        mode: "0600"
      no_log: true
      notify: restart pathway

    - name: config.json
      ansible.builtin.template:
        src: "{{ grove_dir }}/config.json.j2"
        dest: /etc/pathway/config.json
        mode: "0644"
      notify: reload pathway config

    - name: systemd unit
      ansible.builtin.copy:
        src: "{{ grove_dir }}/systemd/pathway.service"
        dest: /etc/systemd/system/pathway.service
        mode: "0644"
      notify:
        - reload systemd
        - restart pathway

    - name: redis started
      ansible.builtin.systemd:
        name: redis-server
        enabled: true
        state: started

    - name: pathway started
      ansible.builtin.systemd:
        name: pathway
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart pathway
      ansible.builtin.systemd:
        name: pathway
        state: restarted
        daemon_reload: true

    - name: reload pathway config
      ansible.builtin.command: systemctl kill -s SIGUSR1 pathway
      changed_when: true
      failed_when: false
