---
# Exporters for one box: node metrics, and GPU metrics when it has cards. Run by
# machine.install_exporters via ansible_runner against a single-host inventory (hosts: all).
#
# Nothing here pushes anywhere and nothing here knows about a Monitoring Agent — these two
# just listen. The agent that scrapes them is named on the box's Inference Server / Proxy
# Server, and the agent asks Grove for the address.
#
# SECURITY: both bind 0.0.0.0, because the agent scrapes them over the box's public IP (on
# EC2 that address is NAT'd and never on the instance's NIC, so it cannot be bound directly).
# The security group is therefore the only thing keeping 9100/9400 off the internet — allow
# them from the Monitoring Agent's IP and nothing else.
- name: Install the metrics exporters
  hosts: all
  become: true
  gather_facts: true
  vars:
    monitoring_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  roles:
    # The credential the exporters answer behind, written alongside them: this play is the only
    # way to re-establish a box's scrape auth without a reboot (Inference Server Setup) or an
    # engine restart (Deploy), which is what an operator needs when the hash changes. Skipped by
    # its own guard if no hash was passed, so a hand-run play cannot lock an agent out.
    #
    # No certificate here. grove_tls_selfsigned is off because only the inference box's nginx ever
    # needed one, it is `creates:`-guarded and already on disk, and issuing one on a front box is
    # what that box explicitly refuses.
    - role: grove_https
      vars:
        grove_tls_selfsigned: false
    - node_exporter
    - role: dcgm_exporter
      when: monitoring_has_gpu | bool
