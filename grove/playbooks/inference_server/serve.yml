---
# Doctype-driven model serve. Run by model_replica.deploy_model via
# ansible_runner against a single-host inventory (hosts: all), with EVERY var
# passed as extra-vars assembled from the Model ⊕ Model Replica (no
# group_vars). Host bootstrap (NVIDIA driver + data volume) is NOT here — it runs
# once per box via provision.yml (Inference Server setup); deploy_model gates on
# is_provisioned. This play just (re)serves the model.
#
# No LiteLLM: the gateway forwards to each vLLM instance through the box's engine proxy. vLLM
# 0.24+ serves /v1/messages natively (Claude Code, tools, streaming) AND reports the prefix
# cache (cache_read_input_tokens) that LiteLLM was silently dropping. One vLLM unit per
# deployment (multi-tenant box); nginx fronts them all on :443, one location per instance.
#
# engine_proxy runs here as well as in provision.yml, so a box provisioned before it existed
# picks it up on its next deploy — and so the vllm role has the reload handlers it notifies.
- name: Serve a model on a GPU inference host
  hosts: all
  become: true
  gather_facts: true
  roles:
    - openresty
    - grove_https
    - engine_proxy
    - vllm
