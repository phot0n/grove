---
# ── Instance identity (multi-tenant box: one container + port per Model Deployment) ─
# A box runs many vLLM instances at once. Each is keyed by a unique slug (provision passes
# the Model Deployment name) → its OWN container name + port + key file + run script. The
# weights/compile caches below stay box-shared so co-located instances don't re-download.
vllm_instance: default
vllm_unit: "vllm-{{ vllm_instance }}"

# ── Install layout ──────────────────────────────────────────────────────────
vllm_user: root
vllm_home: /opt/vllm
# Everything the box keeps for vLLM hangs off vllm_home (the Inference Server's data_path).
# Never default these to /root — the root disk is tiny and multi-GB weights fill it.
vllm_cache_dir: "{{ vllm_home }}/cache"
vllm_hf_home: "{{ vllm_home }}/hf"
vllm_api_key_file: "{{ vllm_home }}/keys/{{ vllm_instance }}.key"

# ── Engine image ────────────────────────────────────────────────────────────
# Required (Model Deployment → Engine Image). The image owns the vLLM version and its whole
# toolchain; the box only supplies the driver. Registry credentials are for a private
# registry only — a public pull needs neither.
vllm_image: ""
vllm_registry_host: ""
vllm_registry_username: ""
vllm_registry_token: ""
# The run script is the container's config: re-rendering it is what triggers a replace. The
# env file beside it holds the secrets, out of the argv.
vllm_container_dir: "{{ vllm_home }}/containers"
vllm_container_script: "{{ vllm_container_dir }}/{{ vllm_unit }}.sh"
vllm_container_env_file: "{{ vllm_container_dir }}/{{ vllm_unit }}.env"

# ── Serving infrastructure (model + tuning via extra-vars from provision.py) ──
# vllm_serve_args is the whole `vllm serve` flag list, built by grove.serve_command
# (ServeCommand). The run script only renders it.
vllm_port: 8080
vllm_serve_args: []
# Engine env vars: Grove's own (attention backend, HF token, long-max-len guard) with the
# deployment's Environment Variables rows layered on top, rendered as the --env-file.
# VLLM_API_KEY is not in here — it is resolved on the box and added by the template.
vllm_env: {}
vllm_predownload_model: true
# What this deploy still has to fit on the box's disk, checked before either download starts.
# The image figure is the COMPRESSED size the registry publishes (Engine Image → Fetch Size),
# so it understates what docker writes — layers arrive compressed and are unpacked onto the
# same disk. Either at 0 means Grove never fetched it, and that half of the check is skipped.
vllm_image_gb: 0
vllm_weights_gb: 0

# ── S3 compile-cache pre-warm (blank bucket = off) ──────────────────────────
# The cache-sync script pulls compiled kernels from the bucket before the container starts
# and pushes them once the engine is healthy. Key axes computed on the box; env carries the
# engine's read/write-compile-cache credentials.
vllm_cache_bucket: ""
vllm_cache_sync_env: {}
vllm_tensor_parallel_size: 1
vllm_model_slug: ""
vllm_cache_sync_script: "{{ vllm_container_dir }}/{{ vllm_unit }}-cache-sync.sh"

# ── Auth / secrets ──────────────────────────────────────────────────────────
vllm_api_key: ""                       # "" = auto-generate + persist to {{ vllm_api_key_file }}
vllm_hf_token: ""                      # optional; gated models / faster HF downloads

# ── Health gate ─────────────────────────────────────────────────────────────
vllm_wait_for_healthy: true            # block until the health path below returns 200
# Polled on vllm_port until it answers, by both the deploy gate and the compile-cache push.
# Grove sends the engine kind's own (vLLM: /health) or whatever the deployment named. Blank =
# no gate, which is what an image that publishes no health path gets.
vllm_health_path: /health
# What is inside the image: 'vllm' takes `vllm serve` arguments, 'custom' serves on its own. Only
# the engine proxy's auth block reads it — everything else is driven by the values above.
vllm_engine_kind: vllm

# ── Warmup gate ─────────────────────────────────────────────────────────────
# /v1/models answering 200 only proves the API server bound its port. One real request proves the
# engine runs a forward pass under the name the gateway is about to route on.
vllm_warmup: true                      # POST the warmup request once the health gate passes
vllm_warmup_request: {}                # {path, body} from the Engine; empty = nothing to prove
