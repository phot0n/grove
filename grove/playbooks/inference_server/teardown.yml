---
# Tear down ONE vLLM instance on a multi-tenant box: its container, the run script and env
# file that would otherwise restart it, and its key file. Run by
# model_deployment.teardown_deployment with extra-var vllm_instance. Deliberately leaves the
# box-shared weights/compile caches and the pulled image intact — sibling instances and
# redeploys still use them.
- name: Tear down a vLLM instance
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Restated from the engine_proxy role's defaults: this play runs no roles, so nothing puts
    # them in scope. Pulling the role in for one path would install nginx during a teardown.
    engine_proxy_engines_dir: /etc/grove/nginx/engines
  tasks:
    - name: Remove the instance container
      ansible.builtin.command: "docker rm -f vllm-{{ vllm_instance }}"
      changed_when: true
      failed_when: false   # no Docker, or no such container → nothing to remove

    # The run script would otherwise restart the container, and the env file beside it holds
    # this instance's API key.
    - name: Remove the instance container run script + env file
      ansible.builtin.file:
        path: "{{ vllm_home }}/containers/vllm-{{ vllm_instance }}.{{ item }}"
        state: absent
      loop:
        - sh
        - env

    - name: Remove the per-instance key file
      ansible.builtin.file:
        path: "{{ vllm_home }}/keys/{{ vllm_instance }}.key"
        state: absent

    - name: Remove the instance's engine proxy location
      ansible.builtin.file:
        path: "{{ engine_proxy_engines_dir }}/{{ vllm_instance }}.conf"
        state: absent
      register: engine_proxy_location

    # Only when something was actually removed, which is also what keeps this play working on a
    # box that predates the engine proxy: no file, no change, no nginx to reload. Validated
    # before the reload so a broken sibling config cannot take the other engines down with it.
    - name: Reload the engine proxy without this instance
      when: engine_proxy_location.changed
      block:
        - name: Check the engine proxy config
          ansible.builtin.command: /usr/local/openresty/bin/openresty -t
          changed_when: false

        - name: Reload the engine proxy
          ansible.builtin.systemd:
            name: openresty
            state: reloaded
