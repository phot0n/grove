---
# Push the fleet's wildcard certificate onto one already-provisioned Gateway Server and reload.
# Nothing else — no packages, no Lua, no nginx.conf, no Go agent. Run by grove.tls after a
# renewal, against every Active proxy at once, so it has to be safe on a live gateway: a reload
# drops no connections, and the config on the box already names these paths.
#
# Deliberately NOT gateway.yml with tags: a renewal happens unattended at midnight, and the smallest
# play that can do the job is the one least likely to change something else while nobody is
# watching.
- name: Install the fleet certificate on a Gateway Server
  hosts: all
  become: true
  gather_facts: false

  roles:
    - fleet_tls

  tasks:
    # Reads the certificate that was just written, so a truncated or mismatched key fails here
    # rather than at the reload. A failure aborts before handlers flush, leaving the box serving
    # the certificate it already had.
    - name: nginx config test
      ansible.builtin.command: /usr/local/openresty/bin/openresty -t
      changed_when: false

  handlers:
    - name: reload openresty
      ansible.builtin.systemd:
        name: openresty
        state: reloaded
