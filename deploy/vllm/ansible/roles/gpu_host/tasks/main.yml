---
# Prepare a fresh GPU host before the vLLM role: install the NVIDIA driver
# (reboot to load it) and mount the data volume. Idempotent — safe to re-run.

# ── NVIDIA driver ───────────────────────────────────────────────────────────
# Probe first, install only if it fails. A box can already have a working driver from its
# image, a .run installer or a newer package than nvidia_driver_pkg — installing ours over
# it is an apt "changed", which used to reboot a box that was serving, to land a driver
# older than the one already working.
- name: Probe nvidia-smi
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_probe
  changed_when: false
  failed_when: false

- name: Install the NVIDIA driver
  when: nvidia_smi_probe.rc != 0
  block:
    - name: Install kernel headers + ubuntu-drivers-common
      ansible.builtin.apt:
        name:
          - "linux-headers-{{ ansible_kernel }}"
          - ubuntu-drivers-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install NVIDIA driver
      ansible.builtin.apt:
        name: "{{ nvidia_driver_pkg }}"
        state: present

    - name: Reboot to load the NVIDIA kernel module
      ansible.builtin.reboot:
        reboot_timeout: 600

- name: Verify the GPU is visible
  ansible.builtin.command: nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
  register: gpu_info
  changed_when: false

- name: GPU
  ansible.builtin.debug:
    var: gpu_info.stdout_lines

- name: Install GPU monitoring tools (nvtop)
  ansible.builtin.apt:
    name: "{{ gpu_host_monitor_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: gpu_host_monitor_packages | length > 0

# ── Data volume ─────────────────────────────────────────────────────────────
- name: Ensure the mount point exists
  ansible.builtin.file:
    path: "{{ gpu_data_mount }}"
    state: directory
    mode: "0755"

- name: Look for the data device
  ansible.builtin.stat:
    path: "{{ gpu_data_device }}"
  register: data_device

# A box with one big root disk has no second device to mount — gpu_data_mount is then a
# plain directory on root and everything below is skipped. Nothing else in the role cares
# whether it is a mount point. Blindly formatting a device that is not there fails the play,
# and gpu_data_device is a role default: a wrong one would name a disk that IS there.
- name: Put the data volume on {{ gpu_data_mount }}
  when: data_device.stat.exists
  block:
    - name: Detect existing filesystem on the data device
      ansible.builtin.command: "blkid -s TYPE -o value {{ gpu_data_device }}"
      register: data_fs
      changed_when: false
      failed_when: false

    - name: Format the data device (only if unformatted)
      ansible.builtin.command: "mkfs.{{ gpu_data_fstype }} -F {{ gpu_data_device }}"
      when: (data_fs.stdout | trim) | length == 0

    - name: Read the data device UUID
      ansible.builtin.command: "blkid -s UUID -o value {{ gpu_data_device }}"
      register: data_uuid
      changed_when: false

    - name: Persist the mount in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\s{{ gpu_data_mount }}\s'
        line: "UUID={{ data_uuid.stdout }} {{ gpu_data_mount }} {{ gpu_data_fstype }} defaults,nofail 0 2"

    - name: Is the data volume mounted?
      ansible.builtin.command: "mountpoint -q {{ gpu_data_mount }}"
      register: mounted
      changed_when: false
      failed_when: false

    - name: Mount the data volume
      ansible.builtin.command: "mount {{ gpu_data_mount }}"
      when: mounted.rc != 0

# ── Docker + NVIDIA container runtime ───────────────────────────────────────
# A Model Deployment with an Engine Image serves from a container instead of a venv.
# Everything below must come AFTER the mount above: Docker's data-root lives on the data
# volume, and writing it into an unmounted mount point would shadow it.
- name: Fetch the NVIDIA container-toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Add the NVIDIA container-toolkit repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    content: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /\n"
    mode: "0644"

# docker.io is deliberately NOT version-pinned: it comes from the Ubuntu archive, so the
# release already bounds it, and an exact pin would both hardcode one Ubuntu version and
# hold back security updates on a network-facing daemon. Behaviour that Docker changes
# between majors is nailed down explicitly in daemon.json below instead — which is what
# survives an upgrade, unlike a pin.
- name: Install Docker and the NVIDIA container toolkit
  ansible.builtin.apt:
    name:
      - docker.io
      - "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}"
    state: present
    update_cache: true

# This role is the only writer of daemon.json — deliberately NOT `nvidia-ctk runtime
# configure`, which rewrites the same file and would fight the data-root below, bouncing
# Docker (and every container on it) on each Setup. The nvidia entry here is what nvidia-ctk
# writes; `--gpus` also works off the toolkit's OCI hook alone.
- name: Read the Docker daemon config
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon
  failed_when: false

- name: Configure the Docker daemon (images on the data volume + the NVIDIA runtime)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | combine(docker_daemon_wanted, recursive=true) | to_nice_json }}\n"
    mode: "0644"
  vars:
    docker_daemon_config: "{{ (docker_daemon.content | b64decode | from_json) if docker_daemon.content is defined else {} }}"
    docker_daemon_wanted:
      data-root: "{{ gpu_data_mount }}/docker"
      # Docker 29 defaults to the containerd image store, which keeps layers under
      # containerd's own root (/var/lib/containerd) — data-root would then govern only
      # volumes and container metadata, and a multi-GB engine image would still extract
      # onto a small root disk and fail with ENOSPC. Off, so data-root means what it says.
      features:
        containerd-snapshotter: false
      runtimes:
        nvidia:
          path: nvidia-container-runtime
          args: []
  notify: restart docker

# Engine containers carry --restart unless-stopped, so dockerd starts them at boot — and
# neither dockerd nor Docker's restart policy knows this volume exists. Without this ordering
# a late mount means dockerd comes up on an empty data-root and a container bind-mounts an
# empty weights cache, silently re-downloading multi-GB onto the mount point. fstab is nofail,
# so that failure is otherwise quiet; RequiresMountsFor makes it loud instead.
- name: Ensure the Docker unit drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Order Docker after the data volume mount
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/data-volume.conf
    content: |
      [Unit]
      RequiresMountsFor={{ gpu_data_mount }}
    mode: "0644"
  notify: restart docker
