---
- name: restart vllm
  ansible.builtin.systemd:
    name: "{{ vllm_unit }}"
    state: restarted
    daemon_reload: true

# The script stops, removes and re-runs the container itself, so this is also what the
# tasks call to start one that is not running. One owner of the replace sequence.
- name: recreate vllm container
  ansible.builtin.command: "{{ vllm_container_script }}"
