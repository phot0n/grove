---
# ── Instance identity (multi-tenant box: one unit + port per Model Deployment) ─
# A box can run many vLLM instances at once. Each is keyed by a unique slug
# (provision passes the Model Deployment name) → its OWN systemd unit + port +
# key file + venv. The venv is per-DEPLOYMENT (fully isolated, so instances with
# different vLLM versions coexist), named <slug>_venv. The weights/compile caches
# below stay box-shared so co-located instances don't re-download or re-compile.
vllm_instance: default
vllm_unit: "vllm-{{ vllm_instance }}"

# ── Install layout ──────────────────────────────────────────────────────────
vllm_user: root
vllm_home: /opt/vllm
vllm_venv: "{{ vllm_home }}/venvs/{{ vllm_instance }}_venv"
vllm_python: python3.12
# Everything the box keeps for vLLM hangs off vllm_home (the Inference Server's data_path).
# Never default these to /root — the root disk is tiny and multi-GB weights fill it.
vllm_cache_dir: "{{ vllm_home }}/cache"
vllm_hf_home: "{{ vllm_home }}/hf"
vllm_api_key_file: "{{ vllm_home }}/keys/{{ vllm_instance }}.key"

# ── Container placement ─────────────────────────────────────────────────────
# Set vllm_image (Model Deployment → Engine Image) to serve from a container instead of a
# venv: the apt/venv/pip tasks are skipped and no systemd unit is installed. Docker owns
# the container (--restart unless-stopped in the run script). The registry credentials are
# only needed for a private registry.
vllm_image: ""
vllm_registry_host: ""
vllm_registry_username: ""
vllm_registry_token: ""
# The run script is the container's config: re-rendering it is what triggers a replace, so
# it plays the role the unit file plays for the venv placement. The env file beside it holds
# the secrets, out of the argv.
vllm_container_dir: "{{ vllm_home }}/containers"
vllm_container_script: "{{ vllm_container_dir }}/{{ vllm_unit }}.sh"
vllm_container_env_file: "{{ vllm_container_dir }}/{{ vllm_unit }}.env"

# APT packages needed for vLLM's runtime kernel compilation (torch-inductor + Triton).
# gcc-13 is required (newer GCC breaks the compile); python3.12-dev provides Python.h.
# On non-24.04 Ubuntu you may need the deadsnakes PPA for python3.12 — add it before this role.
vllm_apt_packages:
  - software-properties-common
  - build-essential
  - make
  - gcc-13
  - g++-13
  - python3.12
  - python3.12-venv
  - python3.12-dev
  - curl
  - git
  - openssl

# ── Serving infrastructure (model + tuning via extra-vars from provision.py) ──
# vllm_serve_args is the whole `vllm serve` flag list, built by grove.serve_command
# (ServeCommand) — the same builder the container placement uses. The unit template only
# renders it, so the two placements can't drift.
vllm_port: 8080
vllm_serve_args: []
# Engine env vars, one dict for both placements: Grove's own (attention backend, HF token,
# long-max-len guard) with the deployment's Environment Variables rows layered on top. The
# venv unit renders them as Environment= lines, the container placement as an --env-file.
# VLLM_API_KEY is not in here — it is resolved on the box below and added by the template.
vllm_env: {}

# ── Blackwell flashinfer workaround (venv placement only) ───────────────────
# flashinfer JIT-compiles kernels and needs a unified CUDA toolkit (CUDA_HOME) that the
# pip-only install does not provide. "0" sidesteps it with the native sampler; the engine
# image ships the toolkit, so the container placement does not set this at all.
vllm_use_flashinfer_sampler: "0"

# ── Auth / secrets ──────────────────────────────────────────────────────────
vllm_api_key: ""                       # "" = auto-generate + persist to {{ vllm_home }}/api_key.txt
vllm_hf_token: ""                      # optional; gated models / faster HF downloads

# ── Health gate ─────────────────────────────────────────────────────────────
vllm_wait_for_healthy: true            # block until /v1/models returns 200
