---
# Two placements share this role. vllm_image set → pull the engine image and let the unit
# run `docker run`; blank → build a per-deployment venv and let the unit run its `vllm serve`.
# Everything after the install split (dirs, keys, unit, health gate) is common to both.
- name: Install build/runtime apt packages
  ansible.builtin.apt:
    name: "{{ vllm_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: vllm_image | length == 0
  tags: heavy

- name: Verify an NVIDIA driver is present and working
  ansible.builtin.command: nvidia-smi
  register: vllm_nvidia_smi
  changed_when: false
  failed_when: vllm_nvidia_smi.rc != 0
  # This role deliberately does NOT install/replace the GPU driver. If this fails,
  # install a driver that exposes your GPU (e.g. `ubuntu-drivers install --gpgpu ...`)
  # and reboot, then re-run.

- name: Create vLLM base directory
  ansible.builtin.file:
    path: "{{ vllm_home }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"

# torch + CUDA wheels are multi-GB; keep pip's build tmp and download cache on
# the (large) vllm_home volume so a small root disk can't fill up.
- name: Reclaim root space from any earlier pip attempt
  ansible.builtin.file:
    path: /root/.cache/pip
    state: absent

- name: Create pip build tmp + cache + per-version venv root + per-instance key dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"
  loop:
    - "{{ vllm_home }}/tmp"
    - "{{ vllm_home }}/pip-cache"
    - "{{ vllm_home }}/venvs"
    - "{{ vllm_home }}/keys"

- name: Create Python virtualenv
  ansible.builtin.command: "{{ vllm_python }} -m venv {{ vllm_venv }}"
  args:
    creates: "{{ vllm_venv }}/bin/python"
  when: vllm_image | length == 0
  tags: heavy

- name: Upgrade pip inside the venv
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ vllm_venv }}"
  when: vllm_image | length == 0
  tags: heavy

- name: Install vLLM (pulls torch cu13 + flashinfer for Blackwell — can take several minutes)
  ansible.builtin.pip:
    name: "vllm{{ ('==' ~ vllm_version) if (vllm_version | length > 0) else '' }}"
    virtualenv: "{{ vllm_venv }}"
  environment:
    TMPDIR: "{{ vllm_home }}/tmp"
    PIP_CACHE_DIR: "{{ vllm_home }}/pip-cache"
  # Run detached + poll: the pip pulls multi-GB wheels for many minutes with no channel
  # output, and some hosts (e.g. RunPod's TCP proxy) cap connection duration and drop a
  # long-held SSH session. async keeps pip alive on the box while Ansible reconnects to
  # poll status, so a mid-install disconnect can't kill it.
  async: 5400
  poll: 15
  when: vllm_image | length == 0
  tags: heavy

- name: Log in to the image registry
  ansible.builtin.command: "docker login {{ vllm_registry_host }} --username {{ vllm_registry_username }} --password-stdin"
  args:
    stdin: "{{ vllm_registry_token }}"
  no_log: true
  changed_when: false
  when: vllm_image | length > 0 and vllm_registry_token | length > 0

- name: Pull the engine image (multi-GB — can take several minutes)
  ansible.builtin.command: "docker pull {{ vllm_image }}"
  # Same long-silent-transfer problem as the pip install above.
  async: 5400
  poll: 15
  when: vllm_image | length > 0
  tags: heavy

- name: Create cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"
  loop:
    - "{{ vllm_cache_dir }}/torchinductor"
    - "{{ vllm_cache_dir }}/triton"
    - "{{ vllm_cache_dir }}/torch"
    - "{{ vllm_hf_home }}"

- name: Write Hugging Face token (optional)
  ansible.builtin.copy:
    dest: "{{ vllm_hf_home }}/token"
    content: "{{ vllm_hf_token }}"
    owner: "{{ vllm_user }}"
    mode: "0600"
  when: vllm_hf_token | length > 0

- name: Generate and persist an API key (only when one is not supplied)
  ansible.builtin.shell: >-
    openssl rand -hex 24 > {{ vllm_api_key_file }}
    && chmod 600 {{ vllm_api_key_file }}
  args:
    creates: "{{ vllm_api_key_file }}"
  when: vllm_api_key | length == 0

- name: Read persisted API key
  ansible.builtin.slurp:
    src: "{{ vllm_api_key_file }}"
  register: vllm_api_key_slurp
  when: vllm_api_key | length == 0

- name: Resolve effective API key
  ansible.builtin.set_fact:
    vllm_effective_api_key: >-
      {{ vllm_api_key if (vllm_api_key | length > 0)
         else (vllm_api_key_slurp.content | b64decode | trim) }}

- name: Pre-download model weights (optional)
  ansible.builtin.command: "{{ vllm_venv }}/bin/hf download {{ vllm_model }}"
  environment:
    HF_HOME: "{{ vllm_hf_home }}"
    HF_TOKEN: "{{ vllm_hf_token }}"
  args:
    creates: "{{ vllm_hf_home }}/hub/models--{{ vllm_model | replace('/', '--') }}"
  when: vllm_predownload_model | bool and vllm_image | length == 0
  # Weights are many GB → same long-silent-download problem as the pip step; run detached
  # + poll so a dropped SSH session can't abort the download.
  async: 7200
  poll: 15
  tags: heavy

# The venv path's `hf` binary lives in the venv, which the container placement never builds —
# so the image's own hf runs the download, into the same box-shared cache the venv path fills.
# `-e HF_TOKEN` forwards the value from the task environment below rather than spelling it
# out in the argv, which Ansible records verbatim on the Ansible Task doc.
- name: Pre-download model weights into the shared cache (container)
  ansible.builtin.command: >-
    docker run --rm --entrypoint hf
    -e HF_TOKEN
    -v {{ vllm_hf_home }}:/root/.cache/huggingface
    {{ vllm_image }} download {{ vllm_model }}
  environment:
    HF_TOKEN: "{{ vllm_hf_token }}"
  args:
    creates: "{{ vllm_hf_home }}/hub/models--{{ vllm_model | replace('/', '--') }}"
  when: vllm_predownload_model | bool and vllm_image | length > 0
  async: 7200
  poll: 15
  tags: heavy

- name: Install vLLM systemd unit
  ansible.builtin.template:
    src: "{{ 'vllm-container.service.j2' if vllm_image | length > 0 else 'vllm.service.j2' }}"
    dest: "/etc/systemd/system/{{ vllm_unit }}.service"
    # Contains VLLM_API_KEY and any operator env (HF/S3 tokens) in cleartext.
    mode: "0600"
  notify: restart vllm

- name: Enable and start vLLM
  ansible.builtin.systemd:
    name: "{{ vllm_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so any unit change is applied before the health check
  ansible.builtin.meta: flush_handlers

- name: Wait for the vLLM API to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vllm_port }}/v1/models"
    headers:
      Authorization: "Bearer {{ vllm_effective_api_key }}"
    status_code: 200
  register: vllm_health
  until: vllm_health.status == 200
  retries: 90
  delay: 10
  changed_when: false
  when: vllm_wait_for_healthy | bool

- name: Show endpoint summary
  ansible.builtin.debug:
    msg:
      - "vLLM is up: http://{{ ansible_host | default(inventory_hostname) }}:{{ vllm_port }}/v1"
      - "Instance unit: {{ vllm_unit }}.service  ({{ ('image ' ~ vllm_image) if vllm_image | length > 0 else ('venv ' ~ vllm_venv) }})"
      - "Model served as: {{ vllm_served_name }}"
      - "API key file on host: {{ vllm_api_key_file }}"
