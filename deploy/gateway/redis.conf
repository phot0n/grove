# Grove gateway local Redis — ZERO-LOSS usage store (§6). Per-server, not shared.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

# Durability: AOF (fsync every write) + RDB snapshots as a second copy.
appendonly yes
appendfsync always
dir /var/lib/redis
appendfilename "grove.aof"
dbfilename grove.rdb
save 900 1
save 300 10
save 60 10000

# Never evict usage/keys/counters.
maxmemory-policy noeviction
